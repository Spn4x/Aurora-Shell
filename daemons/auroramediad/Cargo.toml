[package]
name = "auroramediad"
version = "0.2.0"
edition = "2021"

[dependencies]
zbus = { version = "3.14", features = ["tokio"] }
tokio = { version = "1.28", features = ["full"] }
futures-util = "0.3"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.1"
regex = "1.10"